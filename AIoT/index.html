<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MATTER PROTOCOL // CYBERPUNK INTERFACE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --tron-cyan: #0ff;
            --tron-orange: #ff8c00;
            --bg-color: #020205;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: 'Orbitron', '微軟正黑體', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            -webkit-user-select: none;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        /* 3D Grid Background */
        .grid-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            perspective: 1000px;
            z-index: 0;
            overflow: hidden;
        }

        .grid {
            position: absolute;
            width: 300vw;
            height: 200vh;
            bottom: -50vh;
            left: -100vw;
            background-image:
                linear-gradient(rgba(0, 255, 255, 0.15) 2px, transparent 2px),
                linear-gradient(90deg, rgba(0, 255, 255, 0.15) 2px, transparent 2px);
            background-size: 60px 60px;
            transform: rotateX(70deg);
            animation: gridMove 2.5s linear infinite;
            border-top: 2px solid rgba(0, 255, 255, 0.5);
            box-shadow: 0 0 40px rgba(0, 255, 255, 0.4) inset;
        }

        @keyframes gridMove {
            0% { transform: rotateX(70deg) translateY(0); }
            100% { transform: rotateX(70deg) translateY(60px); }
        }

        /* CRT Scanlines & Vignette */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.2) 51%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 10;
        }

        .vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, transparent 30%, rgba(0, 0, 0, 0.8) 150%);
            pointer-events: none;
            z-index: 11;
        }

        /* SVG Canvas */
        #main-svg {
            position: absolute;
            z-index: 5;
            width: 100%;
            height: 100%;
            display: block;
            transition: opacity 0.8s ease;
        }

        /* Target text responsive styling */
        #target-text {
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 130px;
            letter-spacing: 15px;
            fill: transparent;
            stroke: var(--tron-cyan);
            stroke-width: 3px;
            stroke-dasharray: 40 20;
            animation: dashFlow 1s linear infinite;
            transition: fill 1.2s ease, filter 1.2s ease, stroke-width 1.2s ease, transform 0.8s cubic-bezier(0.2, 0, 0.2, 1), opacity 0.6s ease-in;
            transform-origin: 50% 50%;
            filter: url(#cyanGlow);
        }

        @keyframes dashFlow {
            to { stroke-dashoffset: -60; }
        }

        /* Status UI */
        .status-text {
            position: absolute;
            top: 40px;
            left: 0;
            right: 0;
            text-align: center;
            color: var(--tron-cyan);
            font-size: 12px;
            letter-spacing: 4px;
            text-transform: uppercase;
            z-index: 6;
            opacity: 0.9;
            text-shadow: 0 0 8px var(--tron-cyan);
            pointer-events: none;
        }

        .status-text span {
            animation: blink 0.8s infinite alternate;
        }

        @keyframes blink {
            from { opacity: 0.2; }
            to { opacity: 1; }
        }

        /* Nav Menu */
        .nav-menu {
            position: absolute;
            bottom: 50px;
            left: 0;
            right: 0;
            z-index: 100;
            display: flex;
            justify-content: center;
            gap: 20px;
            padding: 0 20px;
        }

        .nav-item-wrapper {
            position: relative;
            display: inline-block;
        }

        .nav-item {
            color: rgba(91, 179, 179, 0.8);
            font-family: 'Orbitron', '微軟正黑體', sans-serif;
            font-size: 16px;
            font-weight: 700;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .nav-item::before {
            content: '>';
            margin-right: 5px;
            opacity: 0;
            color: var(--tron-cyan);
            transform: translateX(-5px);
            transition: all 0.3s ease;
        }

        .nav-item:hover, .nav-item:active {
            color: var(--tron-cyan);
            text-shadow: 0 0 10px var(--tron-cyan), 0 0 20px var(--tron-cyan);
        }

        .nav-item:hover::before, .nav-item:active::before {
            opacity: 1;
            transform: translateX(0);
        }

        /* Dropdown Menu Styling */
        .dropdown-content {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(2, 2, 5, 0.95);
            border: 1px solid var(--tron-cyan);
            min-width: 200px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
            pointer-events: none;
            padding: 10px 0;
            z-index: 101;
        }

        .dropdown-content::after {
            content: '';
            position: absolute;
            top: 100%;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px;
            border-style: solid;
            border-color: var(--tron-cyan) transparent transparent transparent;
        }

        .nav-item-wrapper:hover .dropdown-content {
            opacity: 1;
            visibility: visible;
            transform: translateX(-50%) translateY(-15px);
            pointer-events: auto;
        }

        .dropdown-item {
            color: rgba(91, 179, 179, 0.9);
            padding: 12px 20px;
            text-decoration: none;
            display: block;
            font-size: 14px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            text-align: left;
            border-left: 0 solid var(--tron-cyan);
        }

        .dropdown-item:hover {
            background: rgba(0, 255, 255, 0.1);
            color: var(--tron-cyan);
            padding-left: 25px;
            border-left: 4px solid var(--tron-cyan);
            text-shadow: 0 0 8px var(--tron-cyan);
        }

        /* Cyberpunk Content Panel */
        #content-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 85%;
            max-width: 900px;
            height: 65vh;
            background: rgba(2, 2, 5, 0.85);
            border: 1px solid var(--tron-cyan);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15) inset, 0 0 15px rgba(0, 255, 255, 0.5);
            padding: 40px;
            overflow-y: auto;
            z-index: 20;
            display: none;
            opacity: 0;
            backdrop-filter: blur(5px);
        }

        #content-panel.active {
            display: block;
            animation: cyber-fade-in 0.6s forwards;
        }

        @keyframes cyber-fade-in {
            0% { opacity: 0; transform: translate(-50%, -48%) scale(0.98); filter: blur(4px); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); filter: blur(0); }
        }

        /* Custom Scrollbar */
        #content-panel::-webkit-scrollbar { width: 6px; }
        #content-panel::-webkit-scrollbar-track { background: rgba(0,0,0,0.5); border-left: 1px solid #111; }
        #content-panel::-webkit-scrollbar-thumb { background: var(--tron-cyan); box-shadow: 0 0 10px var(--tron-cyan); }

        .content-title {
            color: var(--tron-cyan);
            font-size: 28px;
            letter-spacing: 4px;
            border-bottom: 2px dashed var(--tron-cyan);
            padding-bottom: 15px;
            margin-top: 0;
            text-shadow: 0 0 10px var(--tron-cyan);
        }

        .content-body h3 {
            color: var(--tron-orange);
            font-size: 20px;
            letter-spacing: 2px;
            margin-top: 30px;
            border-left: 4px solid var(--tron-orange);
            padding-left: 10px;
        }

        .content-body p, .content-body li {
            color: #d0d0d0;
            line-height: 1.8;
            font-size: 16px;
            letter-spacing: 1px;
            font-family: '微軟正黑體', sans-serif;
        }

        .content-body ul {
            background: rgba(0, 255, 255, 0.05);
            padding: 20px 20px 20px 40px;
            border: 1px solid rgba(0, 255, 255, 0.2);
        }

        .highlight {
            color: #fff;
            font-weight: bold;
            background: rgba(255, 140, 0, 0.3);
            padding: 0 4px;
            border-radius: 2px;
        }

        .cyan-text { color: var(--tron-cyan); font-weight: bold; }

        @media screen and (max-width: 768px) {
            #target-text { font-size: 70px; letter-spacing: 8px; }
            .nav-menu { flex-wrap: wrap; gap: 5px; }
            .nav-item { font-size: 12px; padding: 10px 5px; }
            #content-panel { width: 90%; padding: 20px; height: 70vh; }
            .content-title { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="grid-container"><div class="grid"></div></div>
    <div class="scanlines"></div>
    <div class="vignette"></div>

    <div class="status-text"><span>SYSTEM ONLINE</span> // MATTER PROTOCOL INTERFACE_V1.6</div>

    <svg id="main-svg" viewBox="0 0 1200 800">
        <defs>
            <filter id="cyanGlow">
                <feGaussianBlur stdDeviation="5" result="coloredBlur"/>
                <feMerge>
                    <feMergeNode in="coloredBlur"/>
                    <feMergeNode in="SourceGraphic"/>
                </feMerge>
            </filter>
        </defs>
        <text id="target-text" x="50%" y="50%" dominant-baseline="middle" text-anchor="middle">MATTER</text>
    </svg>

    <div id="content-panel">
        <h2 id="panel-title" class="content-title">DATA STREAM</h2>
        <div id="panel-body" class="content-body"></div>
    </div>

    <div class="nav-menu">
        <div class="nav-item-wrapper">
            <div class="nav-item">核心架構</div>
            <div class="dropdown-content">
                <a href="#" class="dropdown-item" onclick="loadContent('model')">資料模型與 Endpoint</a>
                <a href="#" class="dropdown-item" onclick="loadContent('network')">網通與拓樸需求</a>
            </div>
        </div>
        <div class="nav-item-wrapper">
            <div class="nav-item">平台整合</div>
            <div class="dropdown-content">
                <a href="#" class="dropdown-item" onclick="loadContent('integration')">HomeKit / Google Home 整合</a>
                <a href="#" class="dropdown-item" onclick="loadContent('multiadmin')">Multi-Admin 多網域機制</a>
            </div>
        </div>
        <div class="nav-item-wrapper">
            <div class="nav-item">系統需求</div>
            <div class="dropdown-content">
                <a href="#" class="dropdown-item" onclick="loadContent('hardware')">MCU 硬體規格要求</a>
                <a href="#" class="dropdown-item" onclick="loadContent('software')">軟體 SDK 與架構</a>
            </div>
        </div>
    </div>

    <script>
        const contentData = {
            model: {
                title: "資料模型 (Data Model) // 專有名詞解析",
                body: `
                    <p>Matter 的核心在於其高度標準化的資料模型，所有設備皆須遵循這套由上而下的階層架構：</p>
                    <ul>
                        <li><span class="highlight">Node (節點)</span>：網路上的一個實體或邏輯設備（例如：智慧插座、橋接器）。它是網路定址（IPv6）的基本單位。</li>
                        <li><span class="highlight">Endpoint (端點)</span>：Node 內部的功能實體。如果 Node 是一條多孔延長線，每個獨立的插座就是一個 Endpoint。Endpoint 0 保留給設備本身的管理（Utility）功能。</li>
                        <li><span class="highlight">Cluster (叢集)</span>：特定功能的集合。例如 <code>On/Off Cluster</code> 負責開關控制，<code>Level Control Cluster</code> 負責亮度或音量。Cluster 分為 Server（提供狀態）與 Client（發送指令）。</li>
                        <li><span class="highlight">Attribute (屬性) & Command (指令)</span>：Cluster 內部的具體資料。Attribute 記錄當前狀態（如：電量 80%），Command 則是動作觸發（如：Toggle 切換）。</li>
                    </ul>`
            },
            integration: {
                title: "生態系整合 // Apple / Google / HA",
                body: `
                    <p>將 Matter 設備整合至市面主流平台（如 Apple HomeKit, Google Home, Home Assistant）不再需要針對各家開發專屬 SDK。其運作機制如下：</p>
                    <h3>1. 發現與配對 (mDNS & BLE)</h3>
                    <p>設備上電後，透過 <span class="cyan-text">Bluetooth LE (BLE)</span> 廣播配對訊號。手機上的 Home App 或 Google Home App 接收後，透過掃描 QR Code 或輸入設定碼（Setup Payload）建立初始安全通道 (PASE)。設備加入 Wi-Fi/Thread 網路後，改用 <span class="cyan-text">mDNS (Multicast DNS)</span> 進行區域網路內的服務發現。</p>
                    <h3>2. 憑證與認證 (Device Attestation)</h3>
                    <p>各大平台在配對時，會向 DCL (分散式合規帳本) 驗證設備的 DAC（設備認證憑證）。通過後，平台（如 Apple 軟體路由器或 Google Nest Hub）會簽發一張該生態系專屬的 Node Operational Certificate (NOC) 給設備，正式納入該生態系（Fabric）。</p>
                    <h3>3. 開放原始碼整合 (Home Assistant)</h3>
                    <p>對於 Home Assistant 玩家，Matter 整合需要運行 <code>Matter Server</code> 附加元件。透過 WebSocket 與 HA Core 通訊，直接將 IPv6 網路中的 Matter Endpoint 對映為 HA 的標準 Entity（如 <code>light</code>, <code>switch</code>）。</p>`
            },
            hardware: {
                title: "硬體架構 // MCU 特殊需求",
                body: `
                    <p>Matter 協定極為龐大，對終端設備（Edge Devices）的微控制器（MCU）提出了嚴苛的要求，遠高於傳統的 ESP8266 或一般 Zigbee 晶片：</p>
                    <ul>
                        <li><span class="highlight">Flash 記憶體 (ROM)</span>：至少需要 <span class="cyan-text">1MB ~ 2MB</span> 甚至更高。Matter SDK 核心堆疊加上加密庫（mbedTLS）佔用極大。若支援雙分區 OTA（Over-the-Air）升級，容量需求直接翻倍。</li>
                        <li><span class="highlight">SRAM (記憶體)</span>：至少需要 <span class="cyan-text">256KB ~ 320KB</span> 以上。若設備需要支援多個 Fabric（Multi-Admin），每個 Fabric 的連線與加密狀態都需要消耗額外的 RAM。</li>
                        <li><span class="highlight">加密硬體加速器</span>：強烈建議 MCU 具備硬體 AES, ECC, SHA256 加速單元，否則在 PASE/CASE 安全交握階段會導致嚴重的延遲（Timeout）。</li>
                        <li><span class="highlight">雙模通訊晶片</span>：若為 Thread 設備，晶片必須支援 802.15.4 (Thread) + BLE (用於配網)。例如 ESP32-H2 或 NXP K32W 系統。</li>
                    </ul>`
            },
            network: {
                title: "網通特殊需求 // IPv6 與 Thread",
                body: `
                    <p>Matter 拋棄了傳統特定協定的限制，完全建構於 IP 網路之上：</p>
                    <h3>1. 絕對的 IPv6 依賴</h3>
                    <p>Matter <span class="highlight">不支援 IPv4</span>。局域網內的路由器必須支援並正確派發 IPv6 本地鏈路位址（Link-Local Address）與 ULA。多播（Multicast）功能對於 mDNS 發現至關重要，若企業級 AP 阻擋多播，Matter 將無法配對與通訊。</p>
                    <h3>2. 邊界路由器 (Border Router)</h3>
                    <p>若是基於 Thread 的 Matter 設備，無法直接連上 Wi-Fi。環境中必須存在至少一台 <span class="cyan-text">Thread Border Router (TBR)</span>（例如 Apple HomePod mini、Google Nest Hub 或配置好 HA 的自建 TBR）。TBR 負責將 802.15.4 網狀網路的封包，無縫轉譯為區域網路的 IPv6 封包，不涉及應用層的轉譯，實現真正的端到端通訊。</p>`
            },
            multiadmin: {
                title: "Multi-Admin // 多網域控制架構",
                body: `
                    <p>這是 Matter 最具革命性的功能，允許同一個設備「同時」被加入多個生態系（Fabrics），而不需要解綁。</p>
                    <ul>
                        <li><span class="highlight">Fabric (網域/生態系)</span>：每個平台（如 HomeKit）都會在設備內建立一個獨立的 Fabric 空間。</li>
                        <li><span class="highlight">ACL (存取控制串列)</span>：Matter 透過 ACL 確保安全性。Google 的 Fabric 無法讀取 Apple Fabric 的私有金鑰或配置。</li>
                        <li><span class="highlight">ECW (Enhanced Commissioning Window)</span>：當設備已加入 HomeKit，使用者可從 Home App 開啟「配對模式」，設備會產生一組新的配對碼。此時打開 Google Home App 輸入該碼，設備即可利用既有的 Wi-Fi/Thread 網路，與 Google 建立第二組 CASE 加密通道。</li>
                    </ul>`
            },
            software: {
                title: "軟體架構 // 依賴與 SDK",
                body: `
                    <p>Matter 的軟體層不再是簡單的迴圈，而是需要完整的作業系統支援：</p>
                    <h3>1. 嵌入式作業系統 (RTOS)</h3>
                    <p>Matter SDK (Connectedhomeip) 高度依賴多執行緒，必須運行於 FreeRTOS、Zephyr 或 Linux 之上，用於處理並發的網路請求、加密交握與實體硬體控制。</p>
                    <h3>2. ZCL (Zigbee Cluster Library) 的繼承</h3>
                    <p>Matter 應用層的資料模型大量借鑒了 Zigbee 的架構。開發者需要使用 XML 定義設備的 Endpoint 與 Cluster，然後透過 Matter 的腳本工具（如 ZAP Tool）自動生成 C++ 程式碼架構，大幅改變了傳統物聯網設備的開發流程。</p>`
            }
        };

        function loadContent(key) {
            const data = contentData[key];
            if(!data) return;
            
            // Fade out SVG Title
            document.getElementById('main-svg').style.opacity = '0';
            document.getElementById('main-svg').style.pointerEvents = 'none';

            // Update & Show Panel
            const panel = document.getElementById('content-panel');
            document.getElementById('panel-title').innerText = data.title;
            document.getElementById('panel-body').innerHTML = data.body;
            
            panel.classList.remove('active');
            void panel.offsetWidth; // Trigger reflow to restart animation
            panel.classList.add('active');
        }
    </script>
</body>
</html>
